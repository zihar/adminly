    get:
      operationId: getKelurahan
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Kelurahan" } } } } }
    put:
      operationId: updateKelurahan
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/NewKelurahan" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Kelurahan" } } } } }
    delete:
      operationId: deleteKelurahan
      responses: { "204": { description: No Content } }
  /kelurahan/bulk-delete:
    post:
      operationId: bulkDeleteKelurahan
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/BulkDeleteRequest" } } } }
      responses: { "204": { description: No Content } }
  /kelurahan/options:
    get:
      operationId: optionsKelurahan
      parameters: [ { $ref: "#/components/parameters/Q" } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Option" } } } } } }
components:
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PerPage: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
    Sort: { name: sort, in: query, schema: { type: string } }
    Order: { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
    Q: { name: q, in: query, schema: { type: string } }
  schemas:
    Meta:
      type: object
      required: [total, page, per_page]
      properties:
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
    ErrorEnvelope:
      type: object
      required: [code, status, message]
      properties:
        code: { type: string, example: "99" }
        status: { type: string, example: error }
        message: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
    Option:
      type: object
      required: [value, label]
      properties:
        value: { oneOf: [ { type: string }, { type: integer } ] }
        label: { type: string }
    BulkDeleteRequest:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { oneOf: [ { type: string }, { type: integer } ] } }
    AuditFields:
      type: object
      properties:
        entry_by: { type: ["integer", "null"] }
        entry_on: { type: ["string", "null"], format: date-time }
        update_by: { type: ["integer", "null"] }
        update_on: { type: ["string", "null"], format: date-time }
    Program:
      allOf:
        - $ref: "#/components/schemas/AuditFields"
        - type: object
          required: [id, id_jenis_program, kd_program, program]
          properties:
            id: { type: integer }
            id_jenis_program: { type: integer }
            kd_program: { type: string }
            program: { type: string }
            is_dokumen: { type: boolean }
            is_tertulis: { type: boolean }
            is_psikologi: { type: boolean }
            is_wawancara: { type: boolean }
    NewProgram:
      type: object
      required: [id_jenis_program, kd_program, program]
      properties:
        id_jenis_program: { type: integer }
        kd_program: { type: string }
        program: { type: string }
        is_dokumen: { type: boolean }
        is_tertulis: { type: boolean }
        is_psikologi: { type: boolean }
        is_wawancara: { type: boolean }
    ProgramList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Program" } }
        meta: { $ref: "#/components/schemas/Meta" }
    TahunAjaran:
      type: object
